name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - site/**
      - extensions/**
      - manifest.json
      - .release-please-manifest.json
      - .github/workflows/docs.yml
  workflow_dispatch:
  # Weekly rebuild keeps the IndexNow hashes and link-check baseline fresh.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json

      - name: Set node LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      # `prebuild` syncs every extension's README and changelog first.
      - name: Build site
        run: pnpm run build

      # Hashes each page into dist/indexnow-pages.json and lists the ones that
      # differ from the live site; the indexnow job submits them once deployed.
      # The key is public/<key>.txt. Never fails the build.
      - name: Plan IndexNow submission
        run: node scripts/indexnow.mjs dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

      - name: Upload IndexNow request
        uses: actions/upload-artifact@v7
        with:
          name: indexnow-request
          path: site/indexnow-request.json

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # If this fails, re-run it: the request artifact outlives the run, and the
  # next deploy won't resubmit these pages because their hashes are now live.
  indexnow:
    name: IndexNow
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Download IndexNow request
        uses: actions/download-artifact@v8
        with:
          name: indexnow-request

      - name: Submit changed pages
        run: |
          if [ "$(jq '.urlList | length' indexnow-request.json)" -eq 0 ]; then
            echo "No pages changed"
            exit 0
          fi
          curl -fsS --retry 3 -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data @indexnow-request.json -w 'IndexNow: HTTP %{http_code}\n'
