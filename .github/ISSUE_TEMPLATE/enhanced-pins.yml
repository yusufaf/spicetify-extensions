name: Enhanced Pins
description: Report a bug or suggest an idea for Enhanced Pins
labels: ["enhanced-pins"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Bug
        - Idea
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, or what would you like?
      description: For a bug, include the steps to reproduce it and what you expected instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: The extension version (shown in its settings), your Spotify version (Settings → About), and `spicetify -v`.
      placeholder: Enhanced Pins 1.0.0, Spotify 1.3.6.1921, Spicetify 2.46.4
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Anything in DevTools (Ctrl+Shift+I) that mentions Enhanced Pins, if you can get to it.
      render: text
